# lazygit — Catppuccin Mocha, delta as the diff pager
gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  showCommandLog: false
  sidePanelWidth: 0.3
  theme:
    activeBorderColor: ["#cba6f7", bold]
    inactiveBorderColor: ["#585b70"]
    optionsTextColor: ["#89b4fa"]
    selectedLineBgColor: ["#313244"]
    cherryPickedCommitBgColor: ["#45475a"]
    cherryPickedCommitFgColor: ["#cba6f7"]
    unstagedChangesColor: ["#f38ba8"]
    defaultFgColor: ["#cdd6f4"]
    searchingActiveBorderColor: ["#f9e2af"]
    authorColors:
      "*": "#b4befe"
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --features=lazygit
# Work repos live on GitHub Enterprise (nshift.ghe.com) — tell lazygit it's GitHub
services:
  nshift.ghe.com: github:nshift.ghe.com
os:
  editPreset: nvim-remote
